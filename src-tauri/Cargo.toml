[package]
name = "wot-mod-studio"
version = "0.4.0"
description = "Desktop IDE for World of Tanks Python mod development"
authors = ["you"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "wot_mod_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
